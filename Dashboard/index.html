<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Điều Khiển Xe Điện Thông Minh</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: #090d16;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* KHUNG CHỨA TOÀN MÀN HÌNH */
        .car-display {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #161f38 0%, #0d1322 100%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* --- THANH TRẠNG THÁI TRÊN ĐẦU --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(22, 27, 46, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .location-badge {
            background: rgba(0, 255, 136, 0.15);
            padding: 5px 14px;
            border-radius: 20px;
            color: #00ff88;
            font-size: 13px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .top-right {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .top-right span {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            margin-left: 12px;
        }

        /* KHU VỰC NỘI DUNG CHÍNH */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        /* CẤU TRÚC WIDGET */
        .widget {
            background: rgba(26, 34, 54, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .widget:hover {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(26, 34, 54, 0.7);
        }

        .widget-title {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* CỘT TRÁI: ĐỒNG HỒ TỐC ĐỘ */
        .speed-section {
            justify-content: space-between;
        }

        .speed-dial {
            width: 210px;
            height: 210px;
            border: 6px dashed #00ff88;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.1), 0 0 20px rgba(0, 255, 136, 0.05);
            transition: all 0.5s ease;
            margin: auto 0;
        }

        .speed-value {
            font-size: 76px;
            font-weight: 900;
            color: #00ff88;
            line-height: 1;
        }

        .speed-unit {
            font-size: 14px;
            color: #64748b;
            font-weight: 700;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .speed-footer {
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
        }

        /* KHỐI GIỮA: CHẾ ĐỘ LÁI */
        .mode-section {
            padding: 30px;
            justify-content: space-between;
        }

        .current-mode-container {
            text-align: center;
            margin: auto 0;
        }

        .mode-desc-label {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .current-mode-display {
            font-size: 46px;
            font-weight: 900;
            color: #00ff88;
            text-shadow: 0 0 25px rgba(0, 255, 136, 0.3);
            letter-spacing: 1px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 18px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-eco {
            background: #00ff88;
            color: #040812;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
        }

        .btn-sport {
            background: #ff3333;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.25);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px);
            opacity: 0.95;
        }

        .btn:disabled {
            background: #475569 !important;
            color: #1e293b !important;
            box-shadow: none !important;
            cursor: not-allowed;
            opacity: 0.4;
            transform: none !important;
        }

        /* CỘT PHẢI: PIN & VẬT CẢN */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sub-widget {
            flex: 1;
            align-items: stretch;
            justify-content: space-between;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 1;
            width: 100%;
        }

        .card-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .info-value {
            font-size: 40px;
            font-weight: 800;
            color: #ffffff;
            text-align: right;
        }

        .range-badge {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }

        /* --- THEMES THAY ĐỔI THEO CHẾ ĐỘ SPORT --- */
        .display-sport {
            background: radial-gradient(circle at 50% 50%, #291212 0%, #0d0808 100%);
        }

        .display-sport .top-bar {
            background: rgba(36, 20, 20, 0.7);
        }

        .display-sport .widget {
            background: rgba(46, 26, 26, 0.5);
        }

        .display-sport .speed-dial {
            border-color: #ff3333;
            box-shadow: inset 0 0 30px rgba(255, 51, 51, 0.1), 0 0 20px rgba(255, 51, 51, 0.05);
        }

        .display-sport .speed-value {
            color: #ff3333;
        }

        /* --- HỆ THỐNG TRẠNG THÁI KHẨN CẤP (DANGER & WARNING) --- */
        .battery-low {
            border: 1px solid #ffcc00 !important;
            background: rgba(58, 46, 5, 0.6) !important;
            animation: pulse 1.5s infinite;
        }

        .battery-low .info-value {
            color: #ffcc00;
        }

        .battery-low .range-badge {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
        }

        .distance-danger {
            border: 1px solid #ff3333 !important;
            background: rgba(58, 17, 17, 0.6) !important;
            animation: pulse 1s infinite;
        }

        .distance-danger .info-value {
            color: #ff3333;
        }

        .distance-danger .status-badge {
            background: rgba(255, 51, 51, 0.15);
            color: #ff3333;
        }

        .aeb-active .speed-dial {
            border-style: solid;
            border-color: #ff3333 !important;
            animation: pulse 0.4s infinite;
        }

        .aeb-active .speed-value {
            color: #ff3333 !important;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        /* FOOTER STATUS */
        .system-footer {
            text-align: center;
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="car-display" id="main-screen">

        <div class="top-bar">
            <div class="top-left">
                <span class="location-badge">📍 Hà Nội</span>
                <span id="weather-text">🌤️ Trời nắng nhẹ · 28°C</span>
            </div>
            <div class="top-right">
                <span id="live-time">00:00:00</span>
                <span id="live-date">Đang cập nhật...</span>
            </div>
        </div>

        <div class="main-content">
            <div class="widget speed-section" id="speed-card">
                <div class="widget-title">VẬN TỐC XE</div>
                <div class="speed-dial">
                    <div class="speed-value" id="speed">0</div>
                    <div class="speed-unit">km/h</div>
                </div>
                <div class="speed-footer" id="speed-status">Hệ thống ổn định kết nối</div>
            </div>

            <div class="widget mode-section">
                <div class="widget-title">ĐIỀU KHIỂN HỆ THỐNG</div>
                <div class="current-mode-container">
                    <div class="mode-desc-label">TRẠNG THÁI LÁI HIỆN TẠI</div>
                    <div class="current-mode-display" id="mode-text">CHẾ ĐỘ ECO</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-eco" onclick="changeMode('eco')">ECO</button>
                    <button class="btn btn-sport" id="btn-sport" onclick="changeMode('sport')">SPORT</button>
                </div>
            </div>

            <div class="right-column">
                <div class="widget sub-widget" id="battery-card">
                    <div class="widget-title" style="align-self: flex-start;">NĂNG LƯỢNG</div>
                    <div class="card-row">
                        <div class="card-meta">
                            <span class="range-badge" id="range-val">Hành trình: -- km</span>
                        </div>
                        <div class="info-value"><span id="battery">0</span><span
                                style="font-size: 16px; color:#64748b; font-weight:bold;">%</span></div>
                    </div>
                </div>

                <div class="widget sub-widget" id="distance-card">
                    <div class="widget-title" style="align-self: flex-start;">AN TOÀN HÀNH TRÌNH</div>
                    <div class="card-row">
                        <div class="card-meta">
                            <span class="status-badge" id="distance-status">An toàn</span>
                        </div>
                        <div class="info-value"><span id="distance">--</span><span
                                style="font-size: 16px; color:#64748b; font-weight:bold;">cm</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="system-footer">
            HỆ THỐNG TRẠM TRUNG TÂM: <span id="status" style="color: #ff3333;">MẤT KẾT NỐI SERVER</span>
        </div>
    </div>

    <script>
        // --- 1. ĐỒNG HỒ REAL-TIME CHẠY TỰ ĐỘNG ---
        void function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toTimeString().split(' ')[0];
            const days = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
            document.getElementById('live-date').innerText = `${days[now.getDay()]} , ${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()}`;
            setInterval(updateClock, 1000);
        }();

        // --- 2. LẤY THỜI TIẾT HÀ NỘI REAL-TIME ---
        async function updateWeather() {
            try {
                const response = await fetch('https://wttr.in/Hanoi?format=j1');
                if (!response.ok) return;
                const data = await response.json();
                const temp = data.current_condition[0].temp_C;
                const weatherDesc = data.current_condition[0].lang_vi ? data.current_condition[0].lang_vi[0].value : data.current_condition[0].weatherDesc[0].value;
                let icon = "🌤️";
                if (/mưa|rain/.test(weatherDesc.toLowerCase())) icon = "🌧️";
                else if (/mây|cloud/.test(weatherDesc.toLowerCase())) icon = "☁️";
                else if (/nắng|sun/.test(weatherDesc.toLowerCase())) icon = "☀️";
                document.getElementById('weather-text').innerText = `${icon} ${weatherDesc} · ${temp}°C`;
            } catch (error) {
                document.getElementById('weather-text').innerText = "🌤️ Trời nắng nhẹ · 28°C";
            }
        }
        updateWeather(); setInterval(updateWeather, 600000);

        // --- 3. KẾT NỐI WEBSOCKET SOCKET.IO ---
        // Sử dụng đường dẫn tương đối để tự động nhận IP Server hiện tại khi chạy trên mạng LAN
        const socket = io();
        const statusText = document.getElementById('status');
        const mainScreen = document.getElementById('main-screen');
        const modeText = document.getElementById('mode-text');

        const speedCard = document.getElementById('speed-card');
        const speedStatus = document.getElementById('speed-status');
        const batteryCard = document.getElementById('battery-card');
        const rangeVal = document.getElementById('range-val');
        const distanceCard = document.getElementById('distance-card');
        const distanceStatus = document.getElementById('distance-status');
        const btnSport = document.getElementById('btn-sport');

        socket.on('connect', () => {
            statusText.innerText = "ONLINE"; statusText.style.color = "#00ff88";
        });
        socket.on('disconnect', () => {
            statusText.innerText = "MẤT KẾT NỐI SERVER"; statusText.style.color = "#ff3333";
        });

        // Nhận phản hồi thông báo từ Server nếu cố tình bật SPORT khi pin yếu
        socket.on('command_rejected', (data) => alert(`❌ Không thể thực hiện: ${data.reason}`));

        // Cập nhật dữ liệu từ Server đẩy xuống
        socket.on('web_telemetry', (data) => {
            // Cập nhật tốc độ xe
            if (data.speed !== undefined) {
                document.getElementById('speed').innerText = data.speed.toFixed(1);
            }

            // Xử lý logic hiển thị Pin và Khóa nút SPORT cục bộ nếu Pin < 5%
            if (data.battery !== undefined) {
                document.getElementById('battery').innerText = data.battery;

                if (data.battery < 5) {
                    batteryCard.classList.add('battery-low');
                    btnSport.disabled = true; // Vô hiệu hóa nút SPORT trên giao diện
                } else {
                    batteryCard.classList.remove('battery-low');
                    btnSport.disabled = false; // Mở khóa nút SPORT bình thường
                }
            }

            if (data.range !== undefined) {
                rangeVal.innerText = `Hành trình: ${data.range} km`;
            }

            // Cập nhật khoảng cách thực tế
            if (data.distance !== undefined) {
                document.getElementById('distance').innerText = data.distance.toFixed(1);
            }

            // --- CHUẨN LOGIC MỚI: Đồng bộ hóa toàn bộ UI dựa trên biến an toàn data.aeb ---
            if (data.aeb === true) {
                // Chuyển Đồng hồ tốc độ sang hiệu ứng phanh khẩn cấp nguy hiểm
                speedCard.classList.add('aeb-active');
                speedStatus.innerText = "🚨 AEB: ĐÃ PHANH KHẨN CẤP!";
                speedStatus.style.color = "#ff3333";

                // Chuyển thẻ khoảng cách sang màu đỏ nguy hiểm
                distanceCard.classList.add('distance-danger');
                distanceStatus.innerText = "🚨 NGUY HIỂM";
            } else {
                // Trở về trạng thái bình thường ổn định
                speedCard.classList.remove('aeb-active');
                speedStatus.innerText = "Hệ thống ổn định kết nối";
                speedStatus.style.color = "#64748b";

                distanceCard.classList.remove('distance-danger');
                distanceStatus.innerText = "An toàn";
            }

            // Đồng bộ hiển thị chế độ lái hiện tại của xe
            if (data.mode !== undefined) {
                updateUIForMode(data.mode);
            }
        });

        function changeMode(modeName) {
            socket.emit('control_vehicle', { mode: modeName });
        }

        function updateUIForMode(modeName) {
            if (modeName === 'sport') {
                modeText.innerText = "CHẾ ĐỘ SPORT"; modeText.style.color = "#ff3333";
                modeText.style.textShadow = "0 0 25px rgba(255, 51, 51, 0.5)";
                mainScreen.classList.add('display-sport');
            } else {
                modeText.innerText = "CHẾ ĐỘ ECO"; modeText.style.color = "#00ff88";
                modeText.style.textShadow = "0 0 25px rgba(0, 255, 136, 0.4)";
                mainScreen.classList.remove('display-sport');
            }
        }
    </script>
</body>

</html>
